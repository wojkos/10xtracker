<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>10xDevTracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>10xDevTracker</h1>

  <div id="dashboard-controls">
    <div id="autosync-controls">
      <label for="autosync-enabled">
        <input type="checkbox" id="autosync-enabled" />
        Autosync
      </label>
      <label for="autosync-interval">
        Interval (min)
        <input type="number" id="autosync-interval" min="1" max="1440" />
      </label>
      <span id="autosync-error" role="alert"></span>
    </div>
    <button id="sync-all-btn" type="button">Sync All</button>
    <span id="sync-all-status"></span>
  </div>

  <div id="next-action">
    <h2>Next action</h2>
    <div id="next-action-content"></div>
  </div>

  <div id="projects"></div>
    <form id="add-project-form">
    <label for="project-path">Project path</label>
    <input type="text" id="project-path" name="path" placeholder="D:\path\to\project" required />
    <button type="submit">Add project</button>
  </form>
  <p id="add-project-error" role="alert"></p>

  <script src="app.js"></script>
</body>
</html>
