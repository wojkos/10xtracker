<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>10xDevTracker</title>
</head>
<body>
  <h1>10xDevTracker</h1>
  <p>Foundation scaffold is running.</p>

  <form id="add-project-form">
    <label for="project-path">Project path</label>
    <input type="text" id="project-path" name="path" placeholder="D:\path\to\project" required />
    <button type="submit">Add project</button>
  </form>
  <p id="add-project-error" role="alert"></p>

  <div id="projects"></div>

  <style>
    .sync-error {
      color: #d32f2f;
      margin-top: 0.5em;
      font-size: 0.9em;
    }
    .project-controls {
      margin-bottom: 0.5em;
    }
    .refresh-btn {
      padding: 0.5em 1em;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .refresh-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .refresh-btn:hover:not(:disabled) {
      background-color: #1565c0;
    }
    .loading-indicator {
      display: inline-block;
      margin-left: 0.5em;
      color: #1976d2;
      font-size: 0.9em;
    }
    article {
      margin-bottom: 1em;
      border: 1px solid #ccc;
      padding: 1em;
      border-radius: 4px;
    }
    article header {
      cursor: pointer;
      user-select: none;
    }
    article h2 {
      margin: 0 0 0.5em 0;
      display: inline;
    }
    .summary-stats {
      margin: 0.5em 0 0 0;
      font-size: 0.95em;
      color: #555;
    }
    .blocked-note {
      color: #d32f2f;
      font-weight: bold;
    }
    .details {
      margin-top: 1em;
    }
    .details[hidden] {
      display: none;
    }
  </style>

  <script src="app.js"></script>
</body>
</html>
